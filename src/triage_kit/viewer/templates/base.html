<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}triage viewer{% endblock %}</title>
  <style>
    :root {
      /* surfaces */
      --bg: #f4f6fa;
      --card: #ffffff;
      --chip: #eef2f7;
      --line: #e4e8ef;
      --line-soft: #f1f3f7;

      /* text */
      --ink: #1b2333;
      --sub: #6b7484;
      --faint: #99a1af;

      /* brand + semantic */
      --acc: #2563eb;
      --acc-ink: #1d4ed8;
      --ok: #16a34a;
      --ok-bg: #dcfce7;
      --ok-ink: #15803d;
      --bad: #dc2626;
      --bad-bg: #fee2e2;
      --bad-ink: #b91c1c;
      --warn-bg: #fffbeb;
      --warn-ink: #92400e;

      /* code */
      --code-bg: #0f172a;
      --code-ink: #e2e8f0;

      /* geometry */
      --topbar: 56px;
      --r-sm: 6px;
      --r: 10px;
      --r-lg: 14px;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);

      /* metric colors for the phase timeline */
      --c1: #94a3b8;
      --c2: #60a5fa;
      --c3: #2563eb;
      --c4: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 14px/1.6 var(--sans);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: var(--acc);
      text-decoration: none;
      transition: color .12s ease;
    }

    a:hover {
      color: var(--acc-ink);
      text-decoration: underline;
    }

    /* ---------- top bar ---------- */
    header.top {
      min-height: var(--topbar);
      background: linear-gradient(180deg, #111a2e, #0f172a);
      color: #fff;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    header.top .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    header.top .brand a {
      color: #fff;
    }

    header.top .sub {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 400;
    }

    /* ---------- layout skeleton ---------- */
    .wrap {
      display: flex;
      align-items: flex-start;
      min-height: calc(100vh - var(--topbar));
    }

    nav {
      width: 236px;
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--line);
      position: sticky;
      top: var(--topbar);
      align-self: flex-start;
      max-height: calc(100vh - var(--topbar));
      overflow-y: auto;
      padding: 14px 12px;
    }

    nav .grp {
      font-size: 11px;
      font-weight: 600;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 6px 8px 8px;
      word-break: break-all;
    }

    nav .item {
      display: block;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      font-size: 13px;
      color: var(--ink);
      word-break: break-all;
      transition: background .12s ease, color .12s ease;
    }

    nav .item .badge {
      margin-right: 6px;
    }

    nav .item:hover {
      background: var(--chip);
      color: var(--ink);
      text-decoration: none;
    }

    nav .item.on {
      background: var(--acc);
      color: #fff;
      box-shadow: var(--shadow);
    }

    nav .item.on .badge {
      background: rgba(255, 255, 255, .25);
      color: #fff;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 24px 28px 48px;
      max-width: 1200px;
    }

    /* ---------- typography ---------- */
    h1 {
      font-size: 1.4rem;
      line-height: 1.25;
      letter-spacing: -.015em;
      margin: .1rem 0 .5rem;
      word-break: break-all;
    }

    h2 {
      font-size: 1.02rem;
      letter-spacing: -.005em;
      margin: 2rem 0 .7rem;
      padding-bottom: .35rem;
      border-bottom: 1px solid var(--line);
    }

    h3 {
      font-size: .72rem;
      font-weight: 600;
      margin: .1rem 0 .8rem;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    code {
      background: var(--line-soft);
      border: 1px solid var(--line);
      padding: .04rem .34rem;
      border-radius: var(--r-sm);
      font-family: var(--mono);
      font-size: .84em;
    }

    /* ---------- card ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
    }

    /* ---------- table ---------- */
    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      text-align: left;
      padding: .5rem .65rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: .88rem;
    }

    th {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--sub);
      background: var(--line-soft);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .filters {
      margin: .1rem 0 .9rem;
      font-size: .85rem;
      color: var(--sub);
    }

    .filters a {
      display: inline-block;
      padding: .22rem .7rem;
      margin-right: .4rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-variant-numeric: tabular-nums;
      transition: all .12s ease;
    }

    .filters a:hover {
      text-decoration: none;
      border-color: var(--acc);
      color: var(--acc);
      background: #f7faff;
    }

    .filters a.active {
      background: var(--acc);
      color: #fff;
      border-color: var(--acc);
      box-shadow: var(--shadow);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr {
      transition: background .1s ease;
    }

    tbody tr:hover td {
      background: #f8fafc;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.name {
      font-family: var(--mono);
      font-size: .82rem;
      word-break: break-all;
    }

    /* ---------- KPI ---------- */
    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .kpi .k {
      font-size: 12px;
      color: var(--sub);
      letter-spacing: .01em;
    }

    .kpi .v {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      margin-top: 3px;
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    .kpi .v.good {
      color: var(--ok);
    }

    .kpi .v.badc {
      color: var(--bad);
    }

    .kpi .n {
      font-size: 11px;
      color: var(--sub);
      margin-top: 3px;
    }

    .bar {
      height: 8px;
      background: var(--chip);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 9px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, var(--ok));
      border-radius: 999px;
      transition: width .3s ease;
    }

    /* ---------- badges ---------- */
    .badge {
      display: inline-block;
      padding: .14rem .55rem;
      border-radius: 999px;
      font-size: .69rem;
      font-weight: 600;
      line-height: 1.5;
      white-space: nowrap;
    }

    .b-ok {
      background: var(--ok-bg);
      color: var(--ok-ink);
    }

    .b-bad {
      background: var(--bad-bg);
      color: var(--bad-ink);
    }

    .b-neu {
      background: var(--chip);
      color: var(--sub);
    }

    /* ---------- phase timeline ---------- */
    .timeline {
      display: flex;
      height: 28px;
      border-radius: var(--r-sm);
      overflow: hidden;
      margin-top: 12px;
      font-size: 11px;
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .04);
    }

    .timeline div {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      transition: filter .12s ease;
    }

    .timeline div:not(:first-child) {
      border-left: 1px solid rgba(255, 255, 255, .45);
    }

    .timeline div:hover {
      filter: brightness(1.08);
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--sub);
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: -1px;
    }

    /* ---------- code ---------- */
    pre {
      background: var(--code-bg);
      color: var(--code-ink);
      border: 1px solid rgba(255, 255, 255, .06);
      padding: .85rem 1rem;
      border-radius: var(--r-sm);
      overflow: auto;
      font-family: var(--mono);
      font-size: .8rem;
      line-height: 1.55;
      max-height: 420px;
    }

    /* ---------- rendered markdown ---------- */
    .md {
      line-height: 1.68;
      font-size: .9rem;
    }

    .md h1 {
      font-size: 1.12rem;
      margin: 1.1rem 0 .4rem;
    }

    .md h2 {
      font-size: 1rem;
      border: 0;
      margin: 1.1rem 0 .35rem;
      padding: 0;
    }

    .md h3 {
      font-size: .9rem;
      text-transform: none;
      letter-spacing: 0;
      margin: 1rem 0 .3rem;
    }

    .md p {
      margin: .55rem 0;
    }

    .md ul,
    .md ol {
      margin: .45rem 0;
      padding-left: 1.3rem;
    }

    .md li {
      margin: .18rem 0;
    }

    .md blockquote {
      margin: .7rem 0;
      padding: .15rem .9rem;
      border-left: 3px solid var(--acc);
      background: var(--line-soft);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      color: var(--sub);
    }

    .md td,
    .md th {
      font-size: .85rem;
    }

    .md th {
      background: var(--line-soft);
    }

    /* ---------- disclosure ---------- */
    details summary {
      cursor: pointer;
      color: var(--sub);
      font-size: .85rem;
    }

    details summary:hover {
      color: var(--ink);
    }

    details.step {
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      margin-bottom: .6rem;
      background: var(--card);
      overflow: hidden;
    }

    details.step>summary {
      padding: .55rem .8rem;
      display: flex;
      gap: .5rem;
      align-items: baseline;
      flex-wrap: wrap;
      font-size: .85rem;
      transition: background .12s ease;
    }

    details.step>summary:hover {
      background: #f8fafc;
    }

    details.step[open]>summary {
      border-bottom: 1px solid var(--line);
    }

    details.step .body {
      padding: .3rem .9rem .9rem;
    }

    /* ---------- empty / misc ---------- */
    .empty {
      color: var(--sub);
      padding: 22px;
      text-align: center;
    }

    .muted {
      color: var(--sub);
    }

    .kv {
      font-size: .9rem;
      color: #3a4453;
      margin: .35rem 0;
    }

    /* ---------- tabs ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin: .7rem 0 1.2rem;
      flex-wrap: wrap;
    }

    .tab {
      padding: 9px 15px;
      font-size: 13px;
      color: var(--sub);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      border-radius: var(--r-sm) var(--r-sm) 0 0;
      transition: color .12s ease, background .12s ease;
    }

    .tab:hover {
      color: var(--ink);
      background: var(--line-soft);
      text-decoration: none;
    }

    .tab.on {
      color: var(--acc);
      border-bottom-color: var(--acc);
      font-weight: 600;
      background: #f5f8ff;
    }

    /* ---------- trajectory rendering ---------- */
    .who {
      display: inline-block;
      padding: .08rem .48rem;
      border-radius: var(--r-sm);
      font-size: .68rem;
      font-weight: 600;
      background: var(--chip);
      color: var(--sub);
    }

    .who.agent,
    .who.assistant {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .who.user {
      background: #fef9c3;
      color: #854d0e;
    }

    .who.system {
      background: #e5e7eb;
      color: #374151;
    }

    .cmd {
      background: var(--code-bg);
      color: var(--code-ink);
      padding: .4rem .65rem;
      border-radius: var(--r-sm);
      font-family: var(--mono);
      font-size: .78rem;
      white-space: pre-wrap;
      word-break: break-all;
      margin: .25rem 0;
    }

    .fn {
      font-family: var(--mono);
      font-size: .78rem;
      color: #7c3aed;
      word-break: break-all;
      margin: .25rem 0;
    }

    .lab {
      font-size: .66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--faint);
      margin-top: .6rem;
    }

    .msg {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: .85rem;
      color: #3a4453;
      margin: .15rem 0;
    }

    .tokchart {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 60px;
      margin: 12px 0 0;
    }

    .tokchart a {
      flex: 1;
      min-width: 2px;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    .tokchart i {
      display: block;
      width: 100%;
      min-height: 2px;
      background: var(--acc);
      border-radius: 2px 2px 0 0;
      transition: background .12s ease;
    }

    .tokchart a:hover i {
      background: var(--acc-ink);
    }

    /* ---------- responsive ---------- */
    @media (max-width: 920px) {
      .wrap {
        flex-direction: column;
      }

      nav {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        position: static;
        max-height: 240px;
      }

      main {
        padding: 16px 14px 40px;
      }
    }

    @media print {
      nav {
        display: none;
      }

      header.top {
        position: static;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <span class="brand"><a href="/">triage viewer</a></span>
    <span class="sub">{% block subtitle %}{% endblock %}</span>
  </header>
  <div class="wrap">
    <nav>
      {% if nav_trials %}
      <div class="grp">{{ job_name }}</div>
      {% for t in nav_trials %}
      <a class="item{% if t.name == current %} on{% endif %}" href="/trial/{{ t.name }}">
        <span class="badge {{ 'b-ok' if t.resolved else 'b-bad' }}">{{ '✓' if t.resolved else '✗' }}</span>
        {{ t.name }}
      </a>
      {% endfor %}
      {% elif current %}
      <div class="grp">Trial</div>
      <span class="item on">{{ current }}</span>
      {% endif %}
    </nav>
    <main>{% block body %}{% endblock %}</main>
  </div>
</body>

</html>
