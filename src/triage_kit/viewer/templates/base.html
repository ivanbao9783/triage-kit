<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}triage viewer{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --ink: #1c2330;
      --sub: #66707f;
      --line: #e3e6ec;
      --acc: #2563eb;
      --ok: #16a34a;
      --bad: #dc2626;
      --chip: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 14px/1.6 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    a {
      color: var(--acc);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header.top {
      background: #111827;
      color: #fff;
      padding: 12px 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 14px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    header.top .brand {
      font-size: 16px;
      font-weight: 600;
    }

    header.top .brand a {
      color: #fff;
    }

    header.top .sub {
      color: #9aa4b2;
      font-size: 12px;
    }

    .wrap {
      display: flex;
      align-items: flex-start;
      min-height: calc(100vh - 52px);
    }

    nav {
      width: 230px;
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--line);
      position: sticky;
      top: 52px;
      align-self: flex-start;
      max-height: calc(100vh - 52px);
      overflow-y: auto;
      padding: 12px;
    }

    nav .grp {
      font-size: 11px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 8px 4px 6px;
      word-break: break-all;
    }

    nav .item {
      display: block;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--ink);
      word-break: break-all;
    }

    nav .item:hover {
      background: var(--chip);
      text-decoration: none;
    }

    nav .item.on {
      background: var(--acc);
      color: #fff;
    }

    nav .item.on .badge {
      background: rgba(255, 255, 255, .25);
      color: #fff;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 20px 24px;
      max-width: 1180px;
    }

    h1 {
      font-size: 1.35rem;
      margin: .2rem 0 .4rem;
      word-break: break-all;
    }

    h2 {
      font-size: 1rem;
      margin: 1.8rem 0 .6rem;
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--line);
    }

    h3 {
      font-size: .75rem;
      margin: .2rem 0 .8rem;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    code {
      background: #f1f5f9;
      padding: .05rem .3rem;
      border-radius: 4px;
      font-size: .85em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      text-align: left;
      padding: .45rem .6rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: .88rem;
    }

    th {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--sub);
    }

    .filters {
      margin: .1rem 0 .8rem;
      font-size: .85rem;
      color: var(--sub);
    }

    .filters a {
      display: inline-block;
      padding: .18rem .65rem;
      margin-right: .4rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-variant-numeric: tabular-nums;
    }

    .filters a:hover {
      text-decoration: none;
      border-color: var(--acc);
      color: var(--acc);
    }

    .filters a.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: #fafbfc;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.name {
      font-family: ui-monospace, monospace;
      font-size: .82rem;
      word-break: break-all;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .kpi .k {
      font-size: 12px;
      color: var(--sub);
    }

    .kpi .v {
      font-size: 21px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    .kpi .v.good {
      color: var(--ok);
    }

    .kpi .v.badc {
      color: var(--bad);
    }

    .kpi .n {
      font-size: 11px;
      color: var(--sub);
      margin-top: 2px;
    }

    .bar {
      height: 8px;
      background: var(--chip);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ok);
    }

    .badge {
      display: inline-block;
      padding: .1rem .5rem;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 600;
    }

    .b-ok {
      background: #dcfce7;
      color: #15803d;
    }

    .b-bad {
      background: #fee2e2;
      color: #b91c1c;
    }

    .b-neu {
      background: var(--chip);
      color: var(--sub);
    }

    .timeline {
      display: flex;
      height: 26px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
      font-size: 11px;
      color: #fff;
    }

    .timeline div {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
    }

    .legend {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--sub);
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: -1px;
    }

    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: .8rem 1rem;
      border-radius: 8px;
      overflow: auto;
      font-size: .8rem;
      line-height: 1.5;
      max-height: 420px;
    }

    .md {
      line-height: 1.65;
      font-size: .9rem;
    }

    .md h1 {
      font-size: 1.1rem;
    }

    .md h2 {
      font-size: .98rem;
      border: 0;
      margin: 1rem 0 .3rem;
    }

    .md h3 {
      font-size: .9rem;
      text-transform: none;
      letter-spacing: 0;
      margin: .9rem 0 .3rem;
    }

    .md td,
    .md th {
      font-size: .85rem;
    }

    details summary {
      cursor: pointer;
      color: var(--sub);
      font-size: .85rem;
    }

    details summary:hover {
      color: var(--ink);
    }

    .empty {
      color: var(--sub);
      padding: 20px;
      text-align: center;
    }

    .muted {
      color: var(--sub);
    }

    .kv {
      font-size: .9rem;
      color: #374151;
      margin: .35rem 0;
    }

    /* tab bar — URL-param driven (?tab=), so it stays JS-free */
    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--line);
      margin: .6rem 0 1.1rem;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--sub);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab:hover {
      color: var(--ink);
      text-decoration: none;
    }

    .tab.on {
      color: var(--acc);
      border-bottom-color: var(--acc);
      font-weight: 600;
    }

    /* trajectory rendering */
    .who {
      display: inline-block;
      padding: .05rem .45rem;
      border-radius: 4px;
      font-size: .68rem;
      font-weight: 600;
      background: var(--chip);
      color: var(--sub);
    }

    .who.agent,
    .who.assistant {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .who.user {
      background: #fef9c3;
      color: #854d0e;
    }

    .who.system {
      background: #e5e7eb;
      color: #374151;
    }

    .cmd {
      background: #0f172a;
      color: #e2e8f0;
      padding: .35rem .6rem;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: .78rem;
      white-space: pre-wrap;
      word-break: break-all;
      margin: .25rem 0;
    }

    .fn {
      font-family: ui-monospace, monospace;
      font-size: .78rem;
      color: #7c3aed;
      word-break: break-all;
      margin: .25rem 0;
    }

    .lab {
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--sub);
      margin-top: .55rem;
    }

    .msg {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: .85rem;
      color: #374151;
      margin: .15rem 0;
    }

    details.step {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: .55rem;
      background: var(--card);
    }

    details.step>summary {
      padding: .5rem .75rem;
      display: flex;
      gap: .5rem;
      align-items: baseline;
      flex-wrap: wrap;
      font-size: .85rem;
    }

    details.step>summary:hover {
      background: #fafbfc;
    }

    details.step .body {
      padding: .2rem .85rem .8rem;
      border-top: 1px solid var(--line);
    }

    .tokchart {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 56px;
      margin: 10px 0 0;
    }

    .tokchart a {
      flex: 1;
      min-width: 2px;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    .tokchart i {
      display: block;
      width: 100%;
      min-height: 2px;
      background: var(--acc);
      border-radius: 2px 2px 0 0;
    }

    .tokchart a:hover i {
      background: #1d4ed8;
    }

    @media (max-width: 920px) {
      .wrap {
        flex-direction: column;
      }

      nav {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        position: static;
        max-height: 240px;
      }

      main {
        padding: 16px 12px;
      }
    }

    @media print {
      nav {
        display: none;
      }

      header.top {
        position: static;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <span class="brand"><a href="/">triage viewer</a></span>
    <span class="sub">{% block subtitle %}{% endblock %}</span>
  </header>
  <div class="wrap">
    <nav>
      {% if nav_trials %}
      <div class="grp">{{ job_name }}</div>
      {% for t in nav_trials %}
      <a class="item{% if t.name == current %} on{% endif %}" href="/trial/{{ t.name }}">
        <span class="badge {{ 'b-ok' if t.resolved else 'b-bad' }}">{{ '✓' if t.resolved else '✗' }}</span>
        {{ t.name }}
      </a>
      {% endfor %}
      {% elif current %}
      <div class="grp">Trial</div>
      <span class="item on">{{ current }}</span>
      {% endif %}
    </nav>
    <main>{% block body %}{% endblock %}</main>
  </div>
</body>

</html>
