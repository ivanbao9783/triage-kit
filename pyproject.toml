[project]
name = "triage-kit"
version = "0.1.0"
description = "Decoupled badcase triage & task quality check toolkit for Harbor-ecosystem agent evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
general = ["openai>=1.40"]
claude = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=8.0"]

[project.scripts]
triage = "triage_kit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
